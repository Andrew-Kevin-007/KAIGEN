[package]
name = "kizashi"
version = "0.1.0"
edition = "2021"
description = "KAIGEN omen registry: signature-proven omen death raises the era."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Deliberately no `default` list, so a plain build is the production build:
#   cargo build --release --locked --target wasm32-unknown-unknown -p kizashi    (`make build`)
# The drill twin is the only build that passes `--features drill`. It adds `reset`, which also refuses
# any account that is not `.testnet`. The pre-deploy check must fail if a wasm headed for mainnet
# exports `reset`.
drill = []

[dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unstable"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unstable", "unit-testing"] }
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
